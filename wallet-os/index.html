async function refreshFxRates(){

async function fetchGoldQuote(){
 const response=await fetch("/api/market/gold",{cache:"no-store"});
 const data=await response.json();if(!response.ok)throw new Error(data.detail||"تعذر جلب سعر الذهب");

}
function goldGramPrice(karat=24,target=currency){
 if(!goldQuote)return null;
 const usdPerGram=Number(goldQuote.price_usd_troy_ounce)/31.1034768*(Number(karat)/24);
 const converted=convertAmount(usdPerGram,"USD",target);
 return converted===null?null:converted;
}
const investmentTypeLabels={gold:"ذهب",silver:"فضة",copper:"نحاس",crypto:"عملة رقمية",saudi_stock:"سهم سعودي",global_stock:"سهم عالمي",other:"أصل آخر"};
function investmentMarketKind(type){return ["gold","silver","copper"].includes(type)?"metal":type==="crypto"?"crypto":["saudi_stock","global_stock"].includes(type)?"stock":null;}
function investmentSymbol(type,meta={}){return meta.symbol||({gold:"XAU",silver:"XAG",copper:"HG"}[type]||"");}
function investmentQuoteKey(type,symbol){return investmentMarketKind(type)+":"+String(symbol||"").toUpperCase();}
async function fetchInvestmentQuote(type,symbol){
 const kind=investmentMarketKind(type);if(!kind)throw new Error("هذا النوع لا يملك مصدر تسعير آلي.");
 const key=investmentQuoteKey(type,symbol);if(marketQuotes[key])return marketQuotes[key];
 const url="/api/market/asset?kind="+encodeURIComponent(kind)+"&symbol="+encodeURIComponent(symbol);
 const response=await fetch(url,{cache:"no-store"}),data=await response.json();
 if(!response.ok)throw new Error(data.detail||"تعذر جلب سعر السوق.");
 const price=Number(data.price_usd??data.price);
 if(!(price>0)||!data.updated_at)throw new Error("بيانات السعر لا تحتوي قيمة ووقت تحديث صالحين.");
 const quote={...data,price,currency:data.currency||"USD"};marketQuotes[key]=quote;return quote;
}
function investmentQuantity(item){const m=item.metadata||{};return Number(m.quantity??m.weight_grams)||0;}
function investmentUnitLabel(type){return ({gold:"غرام",silver:"غرام",copper:"رطل",crypto:"عملة",saudi_stock:"سهم",global_stock:"سهم"}[type]||"وحدة");}
function investmentQuoteValue(item,quote){
 if(!quote)return Number(item.current_value)||0;
 const meta=item.metadata||{},type=item.asset_type,quantity=investmentQuantity(item);
 if(!(quantity>0))return Number(item.current_value)||0;
 let amount=quantity*quote.price,from=quote.currency||"USD";
 if(type==="gold"||type==="silver"){amount=quantity*quote.price/31.1034768;if(type==="gold")amount*=Number(meta.karat||24)/24;from="USD";}
 const converted=convertAmount(amount,from,item.currency);
 return converted===null?null:converted;
}
function investmentMarketValue(item){
 const meta=item.metadata||{},symbol=investmentSymbol(item.asset_type,meta),kind=investmentMarketKind(item.asset_type);
 return kind?investmentQuoteValue(item,marketQuotes[investmentQuoteKey(item.asset_type,symbol)]):Number(item.current_value)||0;
}
async function refreshInvestmentQuotes(){
 if(investmentQuoteLoading)return;
 investmentQuoteLoading=true;investmentQuoteError=null;
 try{
  const tasks=[...new Map(investments.filter(x=>investmentMarketKind(x.asset_type)).map(x=>{const symbol=investmentSymbol(x.asset_type,x.metadata||{});return [investmentQuoteKey(x.asset_type,symbol),{type:x.asset_type,symbol}];})).values()];
  const results=await Promise.allSettled(tasks.map(x=>fetchInvestmentQuote(x.type,x.symbol)));
  const failures=[];
  for(let i=0;i<tasks.length;i++)if(results[i].status==="rejected")failures.push(tasks[i].symbol+": "+results[i].reason.message);
  for(const item of investments){
   const meta=item.metadata||{},symbol=investmentSymbol(item.asset_type,meta),kind=investmentMarketKind(item.asset_type);
   if(!kind)continue;
   const quote=marketQuotes[investmentQuoteKey(item.asset_type,symbol)];if(!quote)continue;
   const value=investmentQuoteValue(item,quote);
   if(value===null||!Number.isFinite(value)||value<0)continue;
   const nextMeta={...meta,market_symbol:symbol,market_unit_price:quote.price,market_currency:quote.currency,market_source:quote.source,market_updated_at:quote.updated_at,market_unit:quote.unit,market_quote_name:quote.name};
   const saved=await supa.from("investments").update({current_value:value,metadata:nextMeta}).eq("id",item.id).eq("user_id",user.id);
   if(!saved.error){item.current_value=value;item.metadata=nextMeta;}
  }
  if(failures.length)investmentQuoteError=failures.join(" · ");
 }catch(error){investmentQuoteError=error.message||"تعذر تحديث أسعار الأصول.";}
 finally{investmentQuoteLoading=false;investmentQuoteLoadedAt=Date.now();if(active==="investments")renderPage();}
}
function goldHoldingValue(item){
 const meta=item.metadata||{},weight=Number(meta.weight_grams)||0,karat=Number(meta.karat)||24;
 const unit=goldGramPrice(karat,item.currency);
 return weight>0&&unit!==null?weight*unit:Number(item.current_value)||0;
}
async function updateGoldHoldingValues(){
 if(!goldQuote)return;
 const rows=investments.filter(x=>x.asset_type==="gold"&&Number(x.metadata?.weight_grams)>0);
 for(const item of rows){
  const currentValue=goldHoldingValue(item);
  if(currentValue===null||!Number.isFinite(currentValue)||currentValue<=0){
   throw new Error("لا يمكن تحديث قيمة "+item.name+" لأن سعر الصرف إلى "+item.currency+" غير متوفر. حدّث أسعار الصرف أولًا.");
  }
  const metadata={...(item.metadata||{}),market_source:goldQuote.source,market_updated_at:goldQuote.updated_at,market_price_usd_oz:goldQuote.price_usd_troy_ounce};
  const result=await supa.from("investments").update({current_value:currentValue,metadata}).eq("id",item.id).eq("user_id",user.id);
  if(result.error)throw result.error;
  item.current_value=currentValue;item.metadata=metadata;
 }
}

 if(!from||!to)return null;if(from===to)return 1;

function samePeriod(date,period){

 const currentMonth=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
 return date.slice(0,7)===currentMonth;
}

  const response=await fetch("/api/health",{cache:"no-store"}),data=await response.json();
  const ready=Boolean(response.ok&&data.ollama_reachable&&data.model_available);
  if(badge){badge.textContent=ready?"الخادم متصل والنموذج موجود · فحص حصة الاستخدام عند إرسال الرسائل · "+(data.model||"Ollama"):data.ollama_reachable?"خادم Ollama يعمل لكن النموذج "+(data.model||"المحدد")+" غير موجود عليه":"غير متصل · أضف OLLAMA_API_KEY في Vercel لتفعيل Ollama Cloud";badge.style.color=ready?"#27834a":"#b46a32";}
  return ready;
 }catch(error){if(badge){badge.textContent="تعذر فحص خدمة Ollama";badge.style.color="#b46a32";}return false;}
}
async function sendChat(){
 const input=$("#chatInput"),q=input?.value.trim();if(!q)return;
 const box=$("#messages");box.insertAdjacentHTML("beforeend",'<div class="msg user">'+esc(q)+'</div>');input.value="";
 const context={currency,income:sum("income"),expenses:sum("expense"),net:sum("income")-sum("expense"),fx_rates:fxRates.USD,gold_market:goldQuote?{price_usd_troy_ounce:goldQuote.price_usd_troy_ounce,updated_at:goldQuote.updated_at,source:goldQuote.source}:null,investments:investments.map(x=>({asset_type:x.asset_type,name:x.name,invested_amount:x.invested_amount,current_value:x.asset_type==="gold"?goldHoldingValue(x):x.current_value,currency:x.currency,metadata:x.asset_type==="gold"?{weight_grams:x.metadata?.weight_grams,karat:x.metadata?.karat}:null})),transactions:transactions.slice(0,50).map(t=>({type:t.type,amount:t.amount,currency:t.currency,category:t.category,date:t.transaction_date}))};
 let answer="";
 try{
  const session=(await supa.auth.getSession()).data.session;
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+session.access_token},body:JSON.stringify({message:q,context,language:"ar"})});
  const data=await r.json();if(!r.ok)throw new Error(data.detail||"خدمة المساعد غير متاحة");answer=data.content;
 }catch(e){
  if(/مصروف|انفاق|إنفاق/.test(q))answer="إجمالي المصروفات المسجلة بالعملة "+currency+" هو "+money(sum("expense"))+". هذا حساب مباشر من السجل ولا يتضمن العملات الأخرى.";
  else if(/دخل/.test(q))answer="إجمالي الدخل المسجل هو "+money(sum("income"))+"، وإجمالي المصروفات "+money(sum("expense"))+".";
  else answer="تعذر الاتصال بنموذج Ollama حاليًا. "+e.message+" يمكنك متابعة السجل والرسوم دون المساعد.";
 }
 box.insertAdjacentHTML("beforeend",'<div class="msg bot">'+esc(answer)+'</div>');box.scrollTop=box.scrollHeight;
}
async function init(){
 const cfg=window.WALLET_CONFIG||{};
 if(cfg.supabaseUrl&&cfg.supabaseAnonKey){
  supa=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  supa.auth.onAuthStateChange((event,session)=>{
   if(event==="SIGNED_OUT"){user=null;transactions=[];accounts=[];goals=[];liabilities=[];investments=[];budgets=[];active="dashboard";renderLanding();}
  });
  const {data,error}=await supa.auth.getSession();
  if(error){renderLanding();return;}
  if(data.session){user=data.session.user;await enterApp();return;}
 }
 renderLanding();
}
init();
</script>
