name: WALLET OS checks
on:
  push:
    paths:
      - "wallet-os/**"
      - ".github/workflows/wallet-os-ci.yml"
  pull_request:
    paths:
      - "wallet-os/**"
      - ".github/workflows/wallet-os-ci.yml"
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r wallet-os/requirements.txt
      - run: python -m compileall -q wallet-os/main.py
